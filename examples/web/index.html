<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Agent SDK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f6f8;--surface:#fff;--border:#e5e7eb;
  --text:#1a1a1a;--text2:#6b7280;--accent:#111;
  --user-bg:#111;--user-fg:#fff;
  --tool-bg:#f3f4f6;--tool-border:#e0e1e4;
  --think-bg:#fffbeb;--think-border:#fde68a;
  --ok-bg:#ecfdf5;--ok-border:#86efac;--ok-text:#166534;
  --err-bg:#fef2f2;--err-border:#fca5a5;--err-text:#991b1b;
  --radius:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:16px;font-weight:600}
header button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
header button:hover{background:var(--bg)}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:24px 16px}
#chat-inner{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Welcome */
#welcome{text-align:center;padding:60px 0 30px}
#welcome h2{font-size:22px;font-weight:600;margin-bottom:22px;color:var(--text)}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:0 auto}
.suggestions button{padding:12px 16px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);cursor:pointer;text-align:left;font-size:13px;color:var(--text);transition:border-color .15s}
.suggestions button:hover{border-color:#999}
.suggestions span{margin-right:6px}

/* Message rows */
.msg-row{display:flex}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{justify-content:flex-start}

/* Bubbles */
.bubble-user{background:var(--user-bg);color:var(--user-fg);padding:10px 16px;
  border-radius:18px 18px 4px 18px;max-width:75%;font-size:14px;line-height:1.55;white-space:pre-wrap}
.bubble-assistant{max-width:85%;font-size:14.5px;line-height:1.65}
.bubble-assistant p{margin-bottom:8px}
.bubble-assistant p:last-child{margin-bottom:0}
.bubble-assistant strong{font-weight:600}
.bubble-assistant code{background:#f0f1f3;padding:1px 5px;border-radius:4px;font-size:13px}
.bubble-assistant pre{background:#1e1e1e;color:#d4d4d4;padding:14px 16px;border-radius:10px;
  overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.5}
.bubble-assistant pre code{background:none;padding:0;color:inherit}
.bubble-assistant ul,.bubble-assistant ol{padding-left:22px;margin:6px 0}
.bubble-assistant li{margin:3px 0}

/* Tool call card */
.tool-card{background:var(--tool-bg);border:1px solid var(--tool-border);border-radius:10px;
  padding:10px 14px;margin:8px 0;font-size:13px}
.tool-card .tool-hd{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.tool-card .tool-icon{font-size:15px}
.tool-card .tool-input{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tool-result{margin:4px 0 8px 12px;padding:8px 12px;border-left:3px solid var(--tool-border);
  font-size:12.5px;color:var(--text2);max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

/* Thinking */
.think-box{background:var(--think-bg);border:1px solid var(--think-border);border-radius:10px;
  padding:10px 14px;margin:8px 0;font-size:13px;font-style:italic;color:#92400e}

/* Result banner */
.result-banner{border-radius:10px;padding:10px 16px;font-size:13px;margin:8px 0;display:flex;align-items:center;gap:8px}
.result-banner.ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok-text)}
.result-banner.err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text)}

/* Typing indicator */
.typing{display:flex;align-items:center;gap:4px;padding:8px 0}
.typing span{width:7px;height:7px;background:#aaa;border-radius:50%;animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-6px);opacity:.4}}

/* Streaming text cursor */
.streaming-cursor::after{content:'▋';animation:blink 1s step-end infinite;color:#666}
@keyframes blink{50%{opacity:0}}

/* System info bar */
.sys-bar{background:#f0f4ff;border:1px solid #c7d2fe;border-radius:8px;
  padding:6px 12px;margin:4px 0;font-size:12px;color:#4338ca;display:flex;align-items:center;gap:6px}
.sys-bar .sys-icon{font-size:14px}

/* API retry warning */
.retry-bar{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;
  padding:6px 12px;margin:4px 0;font-size:12px;color:#92400e;display:flex;align-items:center;gap:6px}

/* Rate limit warning */
.rate-bar{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;
  padding:6px 12px;margin:4px 0;font-size:12px;color:#991b1b}

/* Hook card */
.hook-card{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;
  padding:8px 12px;margin:4px 0;font-size:12px;color:#166534}
.hook-card .hook-hd{font-weight:600;margin-bottom:2px}

/* Task / Subagent card */
.task-card{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;
  padding:8px 12px;margin:4px 0;font-size:12px;color:#1e40af;transition:opacity .3s,border-color .3s}
.task-card .task-hd{font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.task-card .task-hd .caret{transition:transform .2s;font-size:10px}
.task-card .task-hd .caret.open{transform:rotate(90deg)}
.task-card .task-body{margin:6px 0 2px;padding:6px 8px;background:#f8fafc;border-radius:6px;
  max-height:400px;overflow-y:auto;font-size:13px;color:var(--text);line-height:1.55}
.task-card .task-body .bubble-assistant{max-width:100%;font-size:13px}
.task-card .task-body .tool-card{font-size:12px}
.task-card .task-body .tool-result{font-size:11px;max-height:120px}
.task-card .task-body .think-box{font-size:12px}
.task-card .task-usage{font-size:11px;color:#6b7280;margin-top:3px}
.task-card .task-out{font-size:11px;color:#6b7280;margin-top:2px}

/* Tool progress (heartbeat) */
.tool-prog{font-size:11px;color:var(--text2);padding:2px 14px;margin:2px 0;
  transition:opacity .2s}

/* Tool use summary */
.tool-summary{background:#f8fafc;border:1px solid var(--tool-border);border-radius:8px;
  padding:6px 12px;margin:4px 0;font-size:12px;color:var(--text2);display:flex;align-items:flex-start;gap:6px;
  line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tool-summary .sum-icon{font-size:14px;flex-shrink:0}

/* Input area */
#input-area{padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--border)}
#input-wrap{max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;
  border:1px solid var(--border);border-radius:26px;padding:6px 8px 6px 18px;background:var(--surface);
  transition:border-color .2s}
#input-wrap:focus-within{border-color:#999}
#prompt{flex:1;border:none;outline:none;font-size:14px;line-height:1.5;resize:none;
  min-height:24px;max-height:180px;font-family:inherit;background:transparent}
#send-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s}
#send-btn:disabled{opacity:.35;cursor:default}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-row,.tool-card,.tool-result,.think-box,.result-banner{animation:fadeIn .2s ease}
</style>
</head>
<body>

<header>
  <h1>Open Agent SDK</h1>
  <button onclick="newSession()" title="New session">+</button>
</header>

<div id="chat">
  <div id="chat-inner">
    <div id="welcome">
      <h2>What can I do for you?</h2>
      <div class="suggestions">
        <button onclick="useSuggestion(this)"><span>&#128193;</span>List files in this project</button>
        <button onclick="useSuggestion(this)"><span>&#128196;</span>Read package.json</button>
        <button onclick="useSuggestion(this)"><span>&#128202;</span>Count lines of code</button>
        <button onclick="useSuggestion(this)"><span>&#128187;</span>Show system info</button>
      </div>
    </div>
  </div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="prompt" rows="1" placeholder="Assign a task or ask anything" onkeydown="handleKey(event)" oninput="autoResize()"></textarea>
    <button id="send-btn" onclick="sendMessage()">&#8593;</button>
  </div>
</div>

<script>
const chatInner = document.getElementById('chat-inner');
const chatEl    = document.getElementById('chat');
const promptEl  = document.getElementById('prompt');
const sendBtn   = document.getElementById('send-btn');
const welcomeEl = document.getElementById('welcome');

let streaming = false;

const TOOL_ICONS = {
  Bash:'&#128736;',Read:'&#128196;',Write:'&#128221;',Edit:'&#9998;',
  Glob:'&#128269;',Grep:'&#128270;',WebFetch:'&#127760;',WebSearch:'&#128269;',
  Agent:'&#129302;',NotebookEdit:'&#128211;',TaskCreate:'&#128203;',
};

// Streaming state — per-context (main or subagent)
let currentToolId = null;
let aBubble = null;

// Main context object (same shape as subagent contexts)
const mainCtx = { textAcc:'', textEl:null, thinkAcc:'', thinkEl:null, container:null };

// Subagent contexts: parentToolUseId -> ctx object
const agentCtx = new Map();

// Map Agent tool_use_id -> task_id
const agentToolToTask = new Map();

function getCtx(parent) {
  if (!parent) {
    mainCtx.container = aBubble;
    return mainCtx;
  }
  if (!agentCtx.has(parent)) {
    agentCtx.set(parent, { textAcc:'', textEl:null, thinkAcc:'', thinkEl:null, container:null });
  }
  const c = agentCtx.get(parent);
  if (!c.container) {
    const taskId = agentToolToTask.get(parent);
    const taskCard = taskId ? document.getElementById('task-'+taskId) : null;
    if (taskCard) {
      let body = taskCard.querySelector('.task-body');
      if (!body) {
        body = document.createElement('div');
        body.className = 'task-body';
        const usage = taskCard.querySelector('.task-usage');
        if (usage) taskCard.insertBefore(body, usage); else taskCard.appendChild(body);
      }
      c.container = body;
    } else if (aBubble) {
      // Fallback: create inline agent card
      const existing = document.getElementById('agent-inline-'+parent);
      if (existing) {
        c.container = existing.querySelector('.task-body');
      } else {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.id = 'agent-inline-'+parent;
        card.innerHTML = `<div class="task-hd"><span class="caret open">▶</span>🤖 Agent</div><div class="task-body"></div>`;
        card.querySelector('.task-hd').onclick = function(){ toggleBody(card); };
        aBubble.appendChild(card);
        c.container = card.querySelector('.task-body');
      }
    }
  }
  return c;
}

function toggleBody(card) {
  const body = card.querySelector('.task-body');
  const caret = card.querySelector('.caret');
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if(caret) caret.classList.toggle('open', hidden);
}

/* ---- helpers ---- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderMarkdown(raw){
  let h = esc(raw);
  // code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code) =>
    `<pre><code class="lang-${lang}">${code.trim()}</code></pre>`);
  // inline code
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // bold
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // unordered lists
  h = h.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>'+m+'</ul>');
  // ordered lists
  h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // paragraphs
  h = h.replace(/\n{2,}/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');
  return '<p>'+h+'</p>';
}

function scrollToBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

function autoResize(){
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 180)+'px';
}

/* ---- actions ---- */
function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}

function useSuggestion(btn){
  const text = btn.textContent.replace(/^.\s*/u,'');
  promptEl.value = text;
  sendMessage();
}

async function newSession(){
  await fetch('/api/new',{method:'POST'});
  chatInner.innerHTML = '';
  chatInner.appendChild(welcomeEl);
  welcomeEl.style.display = '';
}

async function sendMessage(){
  const text = promptEl.value.trim();
  if(!text || streaming) return;
  streaming = true;
  sendBtn.disabled = true;
  promptEl.value = '';
  autoResize();

  // hide welcome
  welcomeEl.style.display = 'none';

  // user bubble
  const uRow = document.createElement('div');
  uRow.className = 'msg-row user';
  uRow.innerHTML = `<div class="bubble-user">${esc(text)}</div>`;
  chatInner.appendChild(uRow);
  scrollToBottom();

  // typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'msg-row assistant';
  typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatInner.appendChild(typingEl);
  scrollToBottom();

  // assistant wrapper
  const aRow = document.createElement('div');
  aRow.className = 'msg-row assistant';
  aBubble = document.createElement('div');
  aBubble.className = 'bubble-assistant';
  aRow.appendChild(aBubble);

  // reset streaming state
  mainCtx.textAcc = ''; mainCtx.textEl = null;
  mainCtx.thinkAcc = ''; mainCtx.thinkEl = null;
  mainCtx.container = null;
  currentToolId = null;
  agentCtx.clear();
  agentToolToTask.clear();
  let typingRemoved = false;

  function ensureTextEl(parent){
    const ctx = getCtx(parent);
    if(!ctx.container) return ctx; // guard: no container yet
    if(!ctx.textEl){
      const el = document.createElement('div');
      el.classList.add('streaming-cursor');
      ctx.container.appendChild(el);
      ctx.textEl = el;
    }
    return ctx;
  }
  function ensureThinkEl(parent){
    const ctx = getCtx(parent);
    if(!ctx.container) return ctx; // guard
    if(!ctx.thinkEl){
      const el = document.createElement('div');
      el.className = 'think-box streaming-cursor';
      ctx.container.appendChild(el);
      ctx.thinkEl = el;
    }
    return ctx;
  }
  function finalizeText(parent){
    const ctx = getCtx(parent);
    if(ctx.textEl) ctx.textEl.classList.remove('streaming-cursor');
    ctx.textAcc = ''; ctx.textEl = null;
  }
  function finalizeThink(parent){
    const ctx = getCtx(parent);
    if(ctx.thinkEl) ctx.thinkEl.classList.remove('streaming-cursor');
    ctx.thinkAcc = ''; ctx.thinkEl = null;
  }
  function getContainer(parent){
    const ctx = getCtx(parent);
    return ctx.container || aBubble;
  }

  try{
    const resp = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text}),
    });

    if(!resp.ok){
      throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    }

    // Two code paths: streaming (ReadableStream) or fallback (text)
    if(resp.body && typeof resp.body.getReader === 'function'){
      // --- Streaming path ---
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buf += decoder.decode(value, {stream:true});
        processSSEBuffer();
      }
      // flush remaining
      if(buf.trim()) processSSEBuffer();

      function processSSEBuffer(){
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for(const line of lines) handleSSELine(line);
      }
    } else {
      // --- Fallback: read full text at once (proxy/polyfill environments) ---
      const fullText = await resp.text();
      for(const line of fullText.split('\n')) handleSSELine(line);
    }

    function handleSSELine(line){
      const trimmed = line.trim();
      if(!trimmed.startsWith('data: ')) return;
      let parsed;
      try{ parsed = JSON.parse(trimmed.slice(6)); } catch{ return; }
      const {event, data} = parsed;
      if(!event || !data) return;

      // remove typing on first real event
      if(!typingRemoved){ typingRemoved = true; typingEl.remove(); chatInner.appendChild(aRow); }

      const p = data.parent || null; // parent_tool_use_id for subagent routing
      const target = getContainer(p);

      switch(event){
        // ======= Streaming deltas =======
        case 'text_delta':{
          const ctx = ensureTextEl(p);
          ctx.textAcc += data.text;
          if(ctx.textEl) ctx.textEl.innerHTML = renderMarkdown(ctx.textAcc);
          scrollToBottom();
          break;
        }

        case 'thinking_delta':{
          const ctx = ensureThinkEl(p);
          ctx.thinkAcc += data.thinking;
          if(ctx.thinkEl) ctx.thinkEl.textContent = ctx.thinkAcc.slice(0,2000);
          scrollToBottom();
          break;
        }

        case 'input_json_delta':{
          if(currentToolId){
            const card = document.getElementById('tool-'+currentToolId);
            if(card){
              let inp = card.querySelector('.tool-input');
              if(inp) inp.textContent = (inp.textContent||'') + data.partial_json;
            }
          }
          break;
        }

        case 'tool_use_start':{
          finalizeText(p); finalizeThink(p);
          currentToolId = data.id;
          const icon = TOOL_ICONS[data.name] || '&#128295;';
          const card = document.createElement('div');
          card.className = 'tool-card';
          card.id = 'tool-'+data.id;
          card.innerHTML = `<div class="tool-hd"><span class="tool-icon">${icon}</span>${esc(data.name)}</div>`
            + `<div class="tool-input"></div>`;
          target.appendChild(card);
          scrollToBottom();
          break;
        }

        // ======= Complete messages =======
        case 'text':{
          finalizeText(p);
          const el = document.createElement('div');
          el.innerHTML = renderMarkdown(data.text);
          target.appendChild(el);
          scrollToBottom();
          break;
        }

        case 'tool_use':{
          finalizeText(p); finalizeThink(p);
          currentToolId = data.id;
          // If this is the Agent tool, record mapping for subagent routing
          if(data.name === 'Agent') agentToolToTask.set(data.id, null);
          const icon2 = TOOL_ICONS[data.name] || '&#128295;';
          const inputStr = typeof data.input === 'string' ? data.input : JSON.stringify(data.input);
          if(!document.getElementById('tool-'+data.id)){
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.id = 'tool-'+data.id;
            card.innerHTML = `<div class="tool-hd"><span class="tool-icon">${icon2}</span>${esc(data.name)}</div>`
              + `<div class="tool-input">${esc(inputStr).slice(0,300)}</div>`;
            target.appendChild(card);
          }
          scrollToBottom();
          break;
        }

        case 'tool_result':{
          const card = document.getElementById('tool-'+data.tool_use_id);
          const rd = document.createElement('div');
          rd.className = 'tool-result';
          rd.textContent = (data.content||'').slice(0,3000);
          if(data.is_error) rd.style.borderColor = 'var(--err-border)';
          if(card) card.after(rd); else target.appendChild(rd);
          scrollToBottom();
          break;
        }

        case 'thinking':{
          finalizeThink(p);
          const tb = document.createElement('div');
          tb.className = 'think-box';
          tb.textContent = (data.thinking||'').slice(0,2000);
          target.appendChild(tb);
          scrollToBottom();
          break;
        }

        // ======= Tool progress =======
        case 'tool_progress':{
          const progId = 'prog-'+(data.tool_use_id||'unknown');
          let pe = document.getElementById(progId);
          if(!pe){
            pe = document.createElement('div');
            pe.className = 'tool-prog';
            pe.id = progId;
            const parentCard = data.tool_use_id ? document.getElementById('tool-'+data.tool_use_id) : null;
            if(parentCard) parentCard.after(pe); else aBubble.appendChild(pe);
          }
          pe.textContent = `⏳ ${data.tool_name||'tool'} running… ${(data.elapsed||0).toFixed(1)}s`;
          scrollToBottom();
          break;
        }

        case 'tool_use_summary':{
          document.querySelectorAll('.tool-prog').forEach(el => el.remove());
          const se = document.createElement('div');
          se.className = 'tool-summary';
          se.innerHTML = `<span class="sum-icon">📋</span><span>${esc((data.summary||'').slice(0,800))}</span>`;
          aBubble.appendChild(se);
          scrollToBottom();
          break;
        }

        // ======= System events =======
        case 'system_init':{
          const si = document.createElement('div');
          si.className = 'sys-bar';
          si.innerHTML = `<span class="sys-icon">🚀</span>Model: ${esc(data.model||'?')} · Tools: ${(data.tools||[]).length}`;
          aBubble.appendChild(si);
          scrollToBottom();
          break;
        }

        case 'api_retry':{
          const ar = document.createElement('div');
          ar.className = 'retry-bar';
          ar.innerHTML = `⚠️ API retry ${data.attempt||'?'}/${data.max_retries||'?'} (${((data.delay_ms||0)/1000).toFixed(1)}s)`;
          aBubble.appendChild(ar);
          scrollToBottom();
          break;
        }

        case 'rate_limit':{
          const rl = document.createElement('div');
          rl.className = 'rate-bar';
          rl.textContent = '⚠️ Rate limited — waiting…';
          aBubble.appendChild(rl);
          scrollToBottom();
          break;
        }

        // ======= Hooks =======
        case 'hook_started':{
          const hc = document.createElement('div');
          hc.className = 'hook-card';
          hc.id = 'hook-'+data.hook_id;
          hc.innerHTML = `<div class="hook-hd">🪝 Hook: ${esc(data.hook_name||'')}</div><div class="hook-out"></div>`;
          aBubble.appendChild(hc);
          scrollToBottom();
          break;
        }
        case 'hook_progress':{
          const hc2 = document.getElementById('hook-'+data.hook_id);
          if(hc2){
            const out = hc2.querySelector('.hook-out');
            if(out) out.textContent += (data.output||'');
          }
          break;
        }
        case 'hook_response':{
          const hc3 = document.getElementById('hook-'+data.hook_id);
          if(hc3){
            const out = hc3.querySelector('.hook-out');
            if(out) out.textContent = `${data.outcome||'done'}: ${(data.output||'').slice(0,500)}`;
          }
          break;
        }

        // ======= Subagent / Background tasks =======
        case 'task_started':{
          const tc = document.createElement('div');
          tc.className = 'task-card';
          tc.id = 'task-'+data.task_id;
          const typeLabel = data.task_type === 'agent' ? '🤖 Agent' : '📌 Task';
          const wf = data.workflow_name ? ` (${esc(data.workflow_name)})` : '';
          tc.innerHTML = `<div class="task-hd"><span class="caret open">▶</span>${typeLabel}${wf}: ${esc(data.description||'')}</div>`
            + `<div class="task-out"></div><div class="task-usage"></div>`;
          tc.querySelector('.task-hd').onclick = function(){ toggleBody(tc); };
          // Link agent tool_use_id -> task_id for subagent message routing
          if(data.tool_use_id) agentToolToTask.set(data.tool_use_id, data.task_id);
          aBubble.appendChild(tc);
          scrollToBottom();
          break;
        }
        case 'task_progress':{
          const tc2 = document.getElementById('task-'+data.task_id);
          if(tc2){
            const out = tc2.querySelector('.task-out');
            if(out) out.textContent = (data.summary||data.description||'').slice(0,500);
            if(data.usage){
              const u = tc2.querySelector('.task-usage');
              if(u) u.textContent = `${data.usage.tool_uses||0} tool calls · ${((data.usage.duration_ms||0)/1000).toFixed(1)}s`;
            }
          }
          scrollToBottom();
          break;
        }
        case 'task_notification':{
          const tc3 = document.getElementById('task-'+data.task_id);
          if(tc3){
            const statusIcon = data.status==='completed' ? '✅' : data.status==='failed' ? '❌' : '⏹️';
            const out = tc3.querySelector('.task-out');
            if(out) out.textContent = `${statusIcon} ${data.status}: ${(data.summary||'').slice(0,500)}`;
            if(data.usage){
              const u = tc3.querySelector('.task-usage');
              if(u) u.textContent = `${data.usage.total_tokens||0} tokens · ${data.usage.tool_uses||0} tool calls · ${((data.usage.duration_ms||0)/1000).toFixed(1)}s`;
            }
            if(data.status==='completed') tc3.style.opacity='0.7';
            else if(data.status==='failed') tc3.style.borderColor='#fca5a5';
          }
          scrollToBottom();
          break;
        }

        // ======= Result & error =======
        case 'result':{
          finalizeText(null); finalizeThink(null);
          const cls = data.is_error ? 'err' : 'ok';
          const icon3 = data.is_error ? '&#10060;' : '&#9989;';
          const label = data.is_error ? 'Error' : 'Done';
          const b = document.createElement('div');
          b.className = 'result-banner '+cls;
          b.innerHTML = `${icon3} ${label} · $${(data.cost||0).toFixed(4)} · ${((data.duration_ms||0)/1000).toFixed(1)}s · ${(data.input_tokens||0)+(data.output_tokens||0)} tokens · ${data.num_turns||0} turns`;
          aBubble.appendChild(b);
          scrollToBottom();
          break;
        }

        case 'error':{
          finalizeText(null); finalizeThink(null);
          const b2 = document.createElement('div');
          b2.className = 'result-banner err';
          b2.innerHTML = `&#10060; Error: ${esc(data.message||'unknown')}`;
          aBubble.appendChild(b2);
          scrollToBottom();
          break;
        }

        case 'done':
          finalizeText(null); finalizeThink(null);
          break;
      }
    }

  }catch(err){
    if(!typingRemoved){ typingEl.remove(); chatInner.appendChild(aRow); }
    const b = document.createElement('div');
    b.className = 'result-banner err';
    b.textContent = 'Network error: '+err.message;
    aBubble.appendChild(b);
  }

  streaming = false;
  sendBtn.disabled = false;
  promptEl.focus();
}
</script>
</body>
</html>
